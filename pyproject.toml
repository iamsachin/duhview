[project]
name = "duhview"
version = "0.1.0"
description = "Agentic code review that catches the obvious-in-hindsight bugs before you push."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.108",
    "mcp>=2.3",  # litellm imports it for any tool-calling request but does not declare it (still true in 1.108.2)
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "typer>=0.27",
    # Code graph: official grammar wheels, pinned. Nothing is downloaded at runtime.
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-php==0.25.1",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-swift==0.7.4",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17", "mypy>=2.4", "types-PyYAML"]

[project.scripts]
duhview = "duhview.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
# Benchmark fixtures contain deliberate bugs.
extend-exclude = ["src/duhview/bench/cases"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["src/duhview/bench/cases/"]
