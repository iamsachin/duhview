name: duhview
description: Agentic code review for pull requests. Posts one review with inline comments.
branding:
  icon: eye
  color: purple

inputs:
  model:
    description: Model name. Defaults to model.name in the base branch's .duhview/config.yaml.
    required: false
    default: ""
  github-token:
    description: Token used to read the pull request and post the review.
    required: false
    default: ${{ github.token }}
  scanners:
    description: Install and run gitleaks and semgrep before the agent ("true" or "false").
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Decide cheaply, before installing anything, whether this event is for duhview.
    - name: Decide what to do
      id: gate
      shell: bash
      run: |
        set -euo pipefail
        ev="$GITHUB_EVENT_PATH"
        field() { jq -r "$1" "$ev"; }
        # Comments can trigger paid model calls, and comment workflows get secrets even on fork
        # PRs: only the repo's owner, members and collaborators (never bots) may trigger duhview.
        trusted() {
          case "$(field .comment.author_association)" in
            OWNER|MEMBER|COLLABORATOR) [ "$(field .comment.user.type)" != Bot ] ;;
            *) false ;;
          esac
        }
        mentions() { field .comment.body | grep -qi '@duhview'; }
        mode=skip
        case "$GITHUB_EVENT_NAME" in
          pull_request)
            if [ "$(field .pull_request.head.repo.full_name)" = "$GITHUB_REPOSITORY" ]; then
              mode=review
            else
              echo "::notice::duhview skipped: pull requests from forks get no secrets; a maintainer can comment '@duhview review'."
            fi ;;
          issue_comment)
            if [ "$(field .action)" = created ] && [ "$(field '.issue.pull_request != null')" = true ] \
                && trusted && mentions; then mode=respond; fi ;;
          pull_request_review_comment)
            if [ "$(field .action)" = created ] && trusted \
                && { mentions || [ "$(field '.comment.in_reply_to_id != null')" = true ]; }; then mode=respond; fi ;;
        esac
        scanners=false
        if [ "$mode" = review ] || { [ "$mode" = respond ] && field .comment.body | grep -qiE '@duhview[[:space:]]+review'; }; then
          scanners=true
        fi
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        echo "scanners=$scanners" >> "$GITHUB_OUTPUT"

    - if: steps.gate.outputs.mode != 'skip'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - if: steps.gate.outputs.mode != 'skip'
      shell: bash
      run: pip install --quiet "$ACTION_PATH"
      env:
        ACTION_PATH: ${{ github.action_path }}

    # Optional: if this fails, the review still runs and reports the scanners as skipped.
    - name: Install scanners (gitleaks, semgrep)
      if: steps.gate.outputs.scanners == 'true' && inputs.scanners == 'true'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/duhview-scanners"
        mkdir -p "$bin"
        echo "$bin" >> "$GITHUB_PATH"
        # semgrep gets its own virtualenv: installed next to duhview it downgrades shared
        # dependencies (it broke LiteLLM's tool calling). Only its executable goes on PATH.
        python -m venv "$RUNNER_TEMP/semgrep-venv"
        "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep==1.184.0  # pinned: new releases can change results
        ln -s "$RUNNER_TEMP/semgrep-venv/bin/semgrep" "$bin/semgrep"
        # Pinned version and SHA-256 from the official release, so a changed download is rejected.
        version=8.30.1
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   arch=linux_x64;   sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
          Linux-ARM64) arch=linux_arm64; sha=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
          *) echo "::notice::gitleaks not installed: no pinned build for $RUNNER_OS/$RUNNER_ARCH"; exit 0 ;;
        esac
        file="$RUNNER_TEMP/gitleaks.tar.gz"
        curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_${arch}.tar.gz"
        echo "$sha  $file" | sha256sum -c -
        tar -xzf "$file" -C "$bin" gitleaks

    - name: Run duhview
      if: steps.gate.outputs.mode != 'skip'
      shell: bash
      # Inputs go through env, never interpolated into the script.
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DUHVIEW_MODEL: ${{ inputs.model }}
        MODE: ${{ steps.gate.outputs.mode }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # The default token cannot resolve review threads; a token you pass in may.
        DUHVIEW_RESOLVE: ${{ inputs.github-token != github.token && '--resolve' || '--no-resolve' }}
      run: |
        if [ "$MODE" = review ]; then
          duhview review --pr "$PR_NUMBER" --post "$DUHVIEW_RESOLVE" ${DUHVIEW_MODEL:+--model "$DUHVIEW_MODEL"}
        else
          duhview respond "$DUHVIEW_RESOLVE" ${DUHVIEW_MODEL:+--model "$DUHVIEW_MODEL"}
        fi
